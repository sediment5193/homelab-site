name: Build and deploy Jekyll site

on:
  push:
    branches: ["main"]
  workflow_dispatch:   # lets you manually trigger a rebuild from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; skip queued runs, let in-progress ones finish
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"     # pinned so builds are reproducible regardless of your local Ruby
          bundler-cache: true      # runs `bundle install`, caches gems between runs

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
